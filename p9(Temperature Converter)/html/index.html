<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>simple Temperature Converter</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="Head-div">
        <div class="Head-Left">
            <p>TempConvert | Fast & Simple Temperature Converter</p>
        </div>

        <div class="Head-Right">
            <img class="Head-Right-img" src="../asset/Thermometer_free_icons_designed_by_Magnific-removebg-preview.png" alt="">
        </div>
    </div>
        <div class="body-cont">
            <div class="Info-Discription">
                <p>Celsius to Fahrenheit and Fahrenheit Celsius</p>
            </div>

        <div class="cont">

            <div class="user-part">

                <div class="user-interface-input">
                    <input class="up1" type="text" placeholder="Type any °F number" >
                    <img src="../asset/_Pngtree_left_and_right_arrow_icons_4636456-removebg-preview.png" alt="">
                    <input class="up2" type="text" placeholder="Type any °C number">
                </div>

                <div class="user-interface-button">
                    <button class="conv-to-C">°F to °C</button>
                    <button class="conv-to-F">°C to °F</button>
                    <button class="Clear">Clear</button>
                </div>

            </div>

        </div>
    </div>

    <script src="../js/script.js"></script>
</body>
</html>
